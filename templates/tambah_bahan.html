{% extends 'base.html' %}

{% block title %}Tambah Bahan Baku - Sistem Gudang Kantin{% endblock %}

{% block content %}
<div class="mb-6 flex items-center">
    <a href="{{ url_for('kelola_bahan') }}" class="mr-4 text-gray-500 hover:text-gray-700">
        <i class="fas fa-arrow-left text-xl"></i>
    </a>
    <div>
        <h2 class="text-2xl font-bold text-gray-800">Tambah Bahan Baku</h2>
        <p class="text-gray-600 text-sm md:text-base">Masukkan data bahan baku baru</p>
    </div>
</div>

<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-2xl">
    <form action="{{ url_for('tambah_bahan') }}" method="POST">
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Bahan Baku <span class="text-red-500">*</span></label>
            <select name="nama_bahan" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 bg-gray-50">
                <option value="">-- Pilih dari Label YOLO --</option>
                {% for nama_kelas in yolo_classes %}
                <option value="{{ nama_kelas }}">{{ nama_kelas }}</option>
                {% endfor %}
            </select>
            <p class="text-xs text-green-600 mt-2"><i class="fas fa-check-circle mr-1"></i> Otomatis disinkronkan dengan label YOLOv8.</p>
        </div>
        
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Kategori</label>
            <input type="text" name="kategori" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500" placeholder="Contoh: Bumbu Cair">
        </div>
        
        <div class="mb-8">
            <label class="block text-gray-700 text-sm font-bold mb-2">Lokasi Rak Seharusnya <span class="text-red-500">*</span></label>
            <select name="id_lokasi" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 bg-gray-50">
                <option value="">-- Pilih Rak --</option>
                {% for rak in rak_list %}
                <option value="{{ rak.id_lokasi }}">{{ rak.nama_rak }} — {{ rak.keterangan }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="flex items-center gap-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-sm">
                <i class="fas fa-save mr-2"></i> Simpan Data
            </button>
            <a href="{{ url_for('kelola_bahan') }}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg transition-colors border border-gray-300">
                Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
