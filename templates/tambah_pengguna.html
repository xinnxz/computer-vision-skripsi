{% extends 'base.html' %}

{% block title %}Tambah Pengguna - Sistem Gudang Kantin{% endblock %}

{% block content %}
<div class="mb-6 flex items-center">
    <a href="{{ url_for('kelola_pengguna') }}" class="mr-4 text-gray-500 hover:text-gray-700">
        <i class="fas fa-arrow-left text-xl"></i>
    </a>
    <div>
        <h2 class="text-2xl font-bold text-gray-800">Tambah Pengguna Baru</h2>
        <p class="text-gray-600 text-sm md:text-base">Mendaftarkan akun pengguna ke dalam sistem</p>
    </div>
</div>

<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-2xl">
    <form action="{{ url_for('tambah_user') }}" method="POST">
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" name="nama" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500" placeholder="Contoh: Budi Santoso">
        </div>
        
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Username <span class="text-red-500">*</span></label>
            <input type="text" name="username" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500" placeholder="Contoh: budi123">
        </div>
        
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password <span class="text-red-500">*</span></label>
            <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500" placeholder="Minimal 6 karakter">
        </div>
        
        <div class="mb-8">
            <label class="block text-gray-700 text-sm font-bold mb-2">Role <span class="text-red-500">*</span></label>
            <select name="role" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 bg-gray-50">
                <option value="pic_gudang">Petugas Gudang</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        
        <div class="flex items-center gap-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-sm">
                <i class="fas fa-save mr-2"></i> Simpan Data
            </button>
            <a href="{{ url_for('kelola_pengguna') }}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg transition-colors border border-gray-300">
                Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
